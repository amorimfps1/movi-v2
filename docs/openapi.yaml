          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClassGroup'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassGroup'
          description: ''
  /api/classes/{id}/:
