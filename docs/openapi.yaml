  /api/leads/:
    get:
      operationId: leads_list
      parameters:
      - in: query
        name: interests
        schema:
          type: array
          items:
            type: integer
        explode: true
        style: form
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      - in: query
        name: source
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - contacting
          - converted
          - new
          - not_converted
          - waiting
        description: |-
          * `new` - Novo
          * `contacting` - Em atendimento
          * `waiting` - Aguardando retorno
          * `converted` - Convertido
          * `not_converted` - Não convertido
      tags:
      - leads
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLeadList'
          description: ''
    post:
      operationId: leads_create
      tags:
      - leads
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Lead'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Lead'
