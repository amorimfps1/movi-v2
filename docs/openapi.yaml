          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedClassGroup'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassGroup'
          description: ''
  /api/enrollments/:
    get:
      operationId: enrollments_list
