          type: string
          format: date
        method:
          $ref: '#/components/schemas/MethodEnum'
        reference:
          type: string
          maxLength: 160
      required:
      - amount
      - method
      - paid_on
    Register:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
          maxLength: 128
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
      required:
      - email
      - first_name
      - password
    Roster:
      type: object
      properties:
        lesson:
          type: integer
        version:
          type: string
        participants:
          type: array
          items:
            $ref: '#/components/schemas/RosterParticipant'
        excluded:
          type: array
          items:
            $ref: '#/components/schemas/RosterExcluded'
        decisions:
          type: array
          items:
            type: string
      required:
      - decisions
      - excluded
      - lesson
      - participants
      - version
    RosterExcluded:
