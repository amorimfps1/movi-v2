      required:
      - access_status
      - email
      - first_name
      - id
      - last_name
      - roles
    UserRoleEnum:
      enum:
      - communication
      - coordinator
      - instructor
      - secretary
      type: string
      description: |-
        * `communication` - communication
        * `coordinator` - coordinator
        * `instructor` - instructor
        * `secretary` - secretary
