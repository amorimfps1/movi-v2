        reason:
          type: string
        decisions:
          type: array
          items:
            type: string
      required:
      - decisions
      - enrollment
      - reason
    RosterParticipant:
      type: object
      properties:
        enrollment:
          type: integer
        student_name:
          type: string
      required:
      - enrollment
      - student_name
    Student:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        cpf:
          type: string
          maxLength: 18
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 30
        birth_date:
          type: string
          format: date
          nullable: true
        address:
          type: string
        notes:
          type: string
        archived:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
    Summary:
      type: object
      properties:
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        demo:
          type: boolean
        timezone:
          type: string
        pending_decisions:
          type: array
          items:
            type: string
        students:
          type: integer
        enrollments:
          type: integer
        classes:
          type: integer
        pending_users:
          type: integer
        leads:
          type: integer
        conversions:
          type: integer
        converted_enrollments:
          type: integer
        received:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        expected:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        outstanding:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        overdue:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        categories:
          type: object
          additionalProperties:
            type: string
            format: decimal
            pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        base:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        final_payout:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        financial_definition:
          type: string
        commercial_definition:
          type: string
      required:
      - demo
      - end
      - pending_decisions
      - start
      - timezone
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          readOnly: true
