      operationId: charges_receive_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este charge.
        required: true
      tags:
      - charges
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Receipt'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Receipt'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Receipt'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionError'
          description: ''
  /api/charges/generate/:
    post:
      operationId: charges_generate_create
      tags:
      - charges
      security:
      - cookieAuth: []
      responses:
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionError'
          description: ''
  /api/classes/:
    get:
      operationId: classes_list
      parameters:
      - in: query
        name: active
        schema:
          type: boolean
      - in: query
        name: allows_trial
        schema:
          type: boolean
      - in: query
        name: instructor
        schema:
          type: integer
      - in: query
        name: modality
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
