          description: ''
  /api/charges/:
    get:
      operationId: charges_list
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - enrollment_fee
          - extra
          - tuition
        description: |-
          * `tuition` - Mensalidade
          * `enrollment_fee` - Taxa de matrícula
          * `extra` - Outra receita
      - in: query
        name: competence
        schema:
          type: string
          format: date
      - in: query
        name: enrollment
        schema:
          type: integer
      - in: query
        name: enrollment__student
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      tags:
      - charges
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedChargeList'
          description: ''
    post:
      operationId: charges_create
      tags:
      - charges
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Charge'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Charge'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Charge'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
          description: ''
  /api/charges/{id}/:
    get:
      operationId: charges_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este charge.
        required: true
      tags:
      - charges
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
          description: ''
  /api/charges/{id}/receive/:
